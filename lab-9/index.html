<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Каталог публикаций</h1>
    <section>
        <h2>1. Базовый уровень — публикации</h2>
        <button onclick="loadPosts()">Загрузить публикации</button>
        <div id="posts"></div>
    </section>
    <section>
        <h2>2. Средний уровень — поиск</h2>
        <input id="search" type="text" placeholder="Введите название публикации">
        <button onclick="searchPosts()">Найти</button>
        <div id="searchResults"></div>
    </section>
    <section>
        <h2>3. Повышенный уровень — статистика задач</h2>
        <button onclick="loadTodos()">Загрузить статистику задач</button>
        <div id="todos"></div>
    </section>
    <script src="app.js"></script>
</body>
</html>
